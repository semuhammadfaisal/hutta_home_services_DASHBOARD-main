<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Hutta Home Services</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/login-styles.css">
</head>
<body>

    <div class="page-shell">

        <!-- ── LEFT PANEL ─────────────────────────────── -->
        <aside class="hero-panel" aria-hidden="true">
            <div class="hero-bg"></div>
            <div class="hero-noise"></div>

            <!-- decorative orbs -->
            <div class="orb orb-1"></div>
            <div class="orb orb-2"></div>
            <div class="orb orb-3"></div>

            <div class="hero-content">
                <img src="../assets/images/logo.png" alt="Hutta Home Services" class="hero-logo">

                <blockquote class="hero-quote">
                    "Transforming homes across the nation — one service at a time."
                </blockquote>

                <div class="hero-stats">
                    <div class="hero-stat">
                        <span class="stat-number">10K+</span>
                        <span class="stat-label">Happy Customers</span>
                    </div>
                    <div class="hero-stat">
                        <span class="stat-number">500+</span>
                        <span class="stat-label">Expert Technicians</span>
                    </div>
                    <div class="hero-stat">
                        <span class="stat-number">24/7</span>
                        <span class="stat-label">Support Available</span>
                    </div>
                </div>
            </div>

            <div class="hero-footer">
                <span class="trust-badge">
                    <i class="fas fa-shield-halved"></i>
                    256-bit SSL encrypted
                </span>
            </div>
        </aside>

        <!-- ── RIGHT PANEL ────────────────────────────── -->
        <main class="form-panel">
            <div class="form-card">

                <header class="card-header">
                    <div class="card-eyebrow">
                        <i class="fas fa-lock" aria-hidden="true"></i>
                        Secure sign-in
                    </div>
                    <h1 class="card-title">Welcome back</h1>
                    <p class="card-subtitle">Enter your credentials to access the operations dashboard.</p>
                </header>

                <form id="loginForm" class="auth-form" novalidate>

                    <div class="field-group">
                        <label class="field-label" for="email">Email address</label>
                        <div class="field-wrap">
                            <i class="fas fa-envelope field-icon" aria-hidden="true"></i>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                class="field-input"
                                placeholder="you@company.com"
                                autocomplete="email"
                                aria-describedby="errorMessage"
                                required
                            >
                        </div>
                    </div>

                    <div class="field-group">
                        <div class="field-label-row">
                            <label class="field-label" for="password">Password</label>
                            <a href="forgot-password.html" class="link-muted">Forgot password?</a>
                        </div>
                        <div class="field-wrap field-wrap--password">
                            <i class="fas fa-lock field-icon" aria-hidden="true"></i>
                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="field-input"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                aria-describedby="errorMessage"
                                required
                            >
                            <button type="button" class="pw-toggle" id="togglePassword" aria-label="Show password">
                                <i class="fas fa-eye" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <label class="remember-row">
                        <input type="checkbox" id="rememberMe" class="sr-only">
                        <span class="custom-check" aria-hidden="true"></span>
                        <span class="remember-text">Keep me signed in for 30 days</span>
                    </label>

                    <button type="submit" class="submit-btn" id="loginBtn">
                        <span class="submit-btn__text">Sign in</span>
                        <i class="fas fa-arrow-right submit-btn__arrow" aria-hidden="true"></i>
                        <i class="fas fa-circle-notch fa-spin submit-btn__spinner" aria-hidden="true"></i>
                    </button>

                    <div
                        class="alert alert--error"
                        id="errorMessage"
                        style="display:none"
                        role="alert"
                        aria-live="polite"
                    >
                        <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
                        <span id="errorText"></span>
                    </div>

                </form>

                <footer class="card-footer">
                    New to Hutta?&nbsp;<a href="signup.html" class="link-primary">Create an account</a>
                </footer>

            </div>
        </main>

    </div><!-- /page-shell -->

    <script src="../assets/js/api-service.js"></script>
    <script src="../assets/js/login-script.js"></script>
</body>
</html>
