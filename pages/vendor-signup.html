<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vendor signup | SMPLfix</title><link rel="stylesheet" href="/assets/css/vendor-portal.css"><link rel="stylesheet" href="/assets/css/portal-brand.css?v=20260916-unified-brand"></head><body class="vendor-auth">
<main class="auth-layout"><section class="auth-copy"><img src="/assets/images/smplfix-logo-reversed.png" alt="SMPLfix"><p class="eyebrow">Vendor network</p><h1>One secure place to get ready for work.</h1><p>Create the login that will own your company’s vendor profile. Banking details stay with Stripe and Tax IDs are encrypted.</p></section>
<section class="auth-card" aria-labelledby="signupHeading"><p class="eyebrow">Vendor registration</p><h2 id="signupHeading">Create your vendor account</h2><form id="vendorSignupForm" class="form-grid">
<label>Company name<input name="companyName" maxlength="160" required></label><label>Legal business name<input name="legalBusinessName" maxlength="200"></label><label>Contact name<input name="contactName" autocomplete="name" required></label><label>Phone<input name="phone" autocomplete="tel" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Entity type<select name="entityType" required><option value="">Choose</option><option>LLC</option><option>Sole Proprietor</option><option>Corporation</option><option>Partnership</option><option>Other</option></select></label><label>Trade classifications<input name="trades" placeholder="HVAC, Plumbing" required></label><label>Business address<input name="businessAddress" maxlength="500"></label><label>Base ZIP code<input name="basePostalCode" maxlength="20"></label><label>Service radius (miles)<input name="radiusMiles" type="number" min="0" max="500" value="25"></label><label class="check"><input name="licensedTrade" type="checkbox"> Licensed trade</label><label>Arizona ROC number<input name="rocLicenseNumber" maxlength="100"></label><label>ROC classification<input name="rocClassification" maxlength="160"></label><p id="signupError" class="form-message error" role="alert" hidden></p><button class="primary" type="submit">Create secure vendor account</button></form><p class="auth-footer">Already registered? <a href="/pages/login.html?returnTo=%2Fpages%2Fvendor-portal.html">Sign in</a></p></section></main>
<script src="/assets/js/api-service.js"></script><script src="/assets/js/vendor-signup.js"></script></body></html>
