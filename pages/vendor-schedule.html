<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Confirm Job Schedule | Hutta Home Services</title><link rel="icon" href="../favicon.ico"><link rel="stylesheet" href="../assets/css/vendor-schedule.css"></head><body>
<header><img src="../assets/images/logo.png" alt="Hutta Home Services"><span>Secure vendor scheduling</span></header><main>
<section id="scheduleLoading" class="state"><div class="spinner"></div><h1>Loading schedule</h1></section><section id="scheduleError" class="state" hidden><h1>Schedule unavailable</h1><p id="scheduleErrorMessage"></p></section>
<article id="scheduleDocument" hidden><div class="title"><div><span>Schedule proposal</span><h1 id="scheduleReference"></h1><p id="scheduleRevision"></p></div><strong id="scheduleStatus"></strong></div>
<div class="times"><div><span>Start · Arizona time</span><strong id="scheduleStart"></strong></div><div><span>End · Arizona time</span><strong id="scheduleEnd"></strong></div></div>
<section><h2>Customer and service location</h2><p><strong id="customerName"></strong><br><span id="customerPhone"></span><br><span id="customerEmail"></span><br><span id="customerAddress"></span></p></section>
<section><h2>Service</h2><p><strong id="serviceName"></strong></p><p id="scopeOfWork" class="preserve"></p></section><section><h2>Access instructions</h2><p id="accessInstructions" class="preserve"></p></section>
<section id="decisionPending" class="decision"><h2>Vendor response</h2><label>Full name<input id="vendorTypedName" maxlength="160" autocomplete="name"></label><div class="actions"><button id="acceptSchedule">Accept Schedule</button><button id="showChanges" class="secondary">Request Changes</button></div><div id="changesPanel" hidden><label>Requested changes<textarea id="changeMessage" minlength="10" maxlength="3000" rows="5"></textarea></label><div class="actions"><button id="submitChanges">Submit Change Request</button><button id="cancelChanges" class="secondary">Cancel</button></div></div><p id="decisionError" class="error" hidden></p></section>
<section id="decisionComplete" class="decision complete" hidden><h2 id="decisionTitle"></h2><p id="decisionSummary"></p></section></article></main><script src="../assets/js/vendor-schedule.js"></script></body></html>
