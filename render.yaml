services:
  - type: web
    name: hutta-home-services
    env: node
    buildCommand: yarn install
    startCommand: node backend/server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: EMAIL_FROM
        value: Hutta Home Services <sales@huttas.com>
      - key: EMAIL_REPLY_TO
        value: sales@huttas.com
      - key: RESEND_API_KEY
        sync: false
      - key: HUTTAS_WEBHOOK_SECRET
        sync: false
      - key: INTAKE_NOTIFICATION_EMAILS
        sync: false
      - key: INTAKE_EMAIL_WORKER_ENABLED
        value: true
      - key: TAX_ID_ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://hutta-home-services-dashboard-main.onrender.com
      - key: PUBLIC_APP_URL
        value: https://hutta-home-services-dashboard-main.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: hutta-documents
      - key: CLOUDINARY_MAX_UPLOAD_BYTES
        value: 52428800
      - key: MAX_UPLOAD_BYTES
        value: 52428800
      - key: MAX_ATTACHMENT_BATCH
        value: 10
      - key: MAX_ATTACHMENT_BATCH_BYTES
        value: 524288000
